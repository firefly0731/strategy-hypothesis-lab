# Mac mini collector (2026-11-25): every public stream the MM research is expected to need, so that
# a later stage does not have to start a new collection. Raw files are never deleted by the
# collector; mm_tick.ob_compact converts each finished UTC day and deletes a raw file only after
# verification (user decision 2026-11-25).
#   USDT MM candidates (17): depth@0ms (every book change) + REST snapshots, aggTrade, bookTicker,
#     liquidations, mark/index/funding
#   USDT liquid small-tick coins (3) and leaders (2): depth@100ms, aggTrade, liquidations, mark price;
#     no bookTicker (≈ 1,000 msg/s on BTC/ETH; the touch is rebuilt from depth)
#   USDC perps that overlap the list above (9): the maker-venue side of a USDC/USDT pair; depth@0ms,
#     aggTrade, bookTicker, mark price (BTC/ETH USDC without bookTicker)
# Book range: REST snapshots of 1,000 levels per side (the maximum); diff updates carry every changed
# level, so their size does not depend on the range. The range only matters at the hourly snapshot.
# Measured 2026-11-25 (5 min, 21:00 KST): an alt coin with every stream (depth@100ms) ≈ 40-140 MB/day
# of gzip; depth@0ms sends 2-3x the depth messages of depth@100ms.
out_dir = "/Users/quant/MarketData/ob_raw"
ws_url = "wss://fstream.binance.com/stream"
rest_url = "https://fapi.binance.com"
snapshot_limit = 1000
snapshot_every_s = 3600
reconnect_every_s = 82800
retention_days = 0
min_free_gb = 100

[symbols]
