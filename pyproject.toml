[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "observer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "websockets>=13",
  "PyJWT>=2.8",
  "orjson>=3.10",
  "aiofiles>=24",
  "polars>=1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "freezegun>=1.5",
  "pytest-cov>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/observer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
